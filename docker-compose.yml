services:
  quizmaster:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Signs session cookies and derives storage paths. Generate once:
      #   openssl rand -hex 32
      # Changing it signs everyone out and makes existing profiles unreachable.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DATA_DIR: /data
      # Optional: lets everyone on this server read word lists with Claude,
      # billed to this key. Without it each person can use their own.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - quizmaster-data:/data

volumes:
  quizmaster-data:
